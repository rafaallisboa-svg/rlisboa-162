    .fic26-cob-rp-img { position: relative; display: block; aspect-ratio: 16 / 10; overflow: hidden; }
    .fic26-cob-rp-img img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .5s ease; }
    .fic26-cob-rp-card:hover .fic26-cob-rp-img img { transform: scale(1.05); }
    .fic26-cob-rp-chip { position: absolute; left: 16px; top: 16px; padding: 6px 12px; border-radius: 999px; background: var(--azul-prof); color: #fff; font-weight: 800; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; }

    .fic26-cob-rp-more { display: flex; align-items: center; gap: 8px; margin-top: 16px; font-weight: 800; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: #E58A00; }
