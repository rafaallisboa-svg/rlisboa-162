<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<base target="_blank"/>
<title>O site · Priscila Andrade</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
html,body{margin:0;padding:0;background:#000;}
</style>
</head>
<body>
<section class="st">
<style>
.st{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:#000;color:#F3EEE4;padding:clamp(48px,7vw,96px) clamp(16px,4vw,48px) clamp(24px,4vw,48px);}
.st *,.st *::before,.st *::after{box-sizing:border-box;}
.st-in{max-width:1240px;margin:0 auto;}
.st-eyebrow{display:block;font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:#B08D57;font-weight:600;margin:0 0 .9rem;}
.st-h{font-family:'Fraunces',Georgia,serif;font-weight:500;font-size:clamp(1.8rem,3.6vw,2.8rem);line-height:1.1;letter-spacing:-.01em;margin:0 0 .9rem;max-width:20ch;}
.st-p{font-size:.95rem;line-height:1.6;color:rgba(243,238,228,.68);margin:0;max-width:52ch;}

.st-stage{position:relative;margin-top:clamp(28px,4vw,48px);padding-bottom:6%;}
.st-bw{border-radius:10px;overflow:hidden;background:#1B1A18;box-shadow:0 30px 70px -20px rgba(0,0,0,.9);border:1px solid rgba(243,238,228,.12);}
.st-bar{display:flex;align-items:center;gap:6px;padding:9px 12px;background:#26241f;}
.st-bar i{width:9px;height:9px;border-radius:50%;background:rgba(243,238,228,.25);display:block;}
.st-url{margin-left:10px;flex:1;max-width:340px;font-size:.66rem;color:rgba(243,238,228,.55);background:rgba(243,238,228,.07);border-radius:100px;padding:3px 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.st-bw img{display:block;width:100%;height:auto;}
.st-main{width:86%;}
.st-phone{position:absolute;right:0;bottom:0;width:19%;min-width:120px;border-radius:clamp(14px,2.4vw,26px);padding:clamp(4px,.6vw,7px);background:#1B1A18;border:1px solid rgba(243,238,228,.22);box-shadow:0 30px 70px -15px rgba(0,0,0,.95);}
.st-phone img{display:block;width:100%;height:auto;border-radius:clamp(11px,2vw,20px);}

.st-row{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(14px,2vw,24px);margin-top:clamp(20px,3vw,36px);}
.st-fig{margin:0;}
.st-fig figcaption{margin-top:.8rem;font-size:.8rem;line-height:1.5;color:rgba(243,238,228,.62);}
.st-fig b{display:block;font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:#B08D57;font-weight:600;margin-bottom:.25rem;}

.st-mob{display:grid;grid-template-columns:repeat(2,minmax(0,200px));gap:clamp(14px,2vw,24px);margin-top:clamp(20px,3vw,36px);}
.st-mob .st-phone{position:static;width:100%;}

@media (max-width:760px){
  .st-main{width:100%;}
  .st-stage{padding-bottom:0;}
  .st-phone{display:none;}
  .st-stage .st-phone{display:block;position:static;width:52%;margin:-10% auto 0;}
  .st-row{grid-template-columns:1fr;}
}
</style>
<div class="st-in">
  <span class="st-eyebrow">O site</span>
  <h2 class="st-h">Portfólio, clientes e contato numa página só</h2>
  <p class="st-p">Uma navegação simples, pensada para o corretor e a incorporadora chegarem ao trabalho em poucos cliques, no computador e no celular.</p>

  <div class="st-stage">
    <div class="st-bw st-main">
      <div class="st-bar"><i></i><i></i><i></i><span class="st-url">priscilaandradefoto.com.br</span></div>
      <img src="d-home.jpg" alt="Página inicial do site da Priscila Andrade" loading="lazy" decoding="async"/>
    </div>
    <div class="st-phone"><img src="m-home.jpg" alt="Página inicial no celular" loading="lazy" decoding="async"/></div>
  </div>

  <div class="st-row">
    <figure class="st-fig">
      <div class="st-bw"><div class="st-bar"><i></i><i></i><i></i></div><img src="d-sobre.jpg" alt="Seção sobre" loading="lazy" decoding="async"/></div>
      <figcaption><b>Sobre</b>Quem é a Priscila, a área de atuação e os serviços.</figcaption>
    </figure>
    <figure class="st-fig">
      <div class="st-bw"><div class="st-bar"><i></i><i></i><i></i></div><img src="d-portfolio.jpg" alt="Lista de projetos" loading="lazy" decoding="async"/></div>
      <figcaption><b>Portfólio</b>Projetos numerados. Ao passar o cursor aparece a foto, e o clique abre a galeria completa.</figcaption>
    </figure>
    <figure class="st-fig">
      <div class="st-bw"><div class="st-bar"><i></i><i></i><i></i></div><img src="d-clientes.jpg" alt="Clientes já atendidos" loading="lazy" decoding="async"/></div>
      <figcaption><b>Clientes</b>Grade com as imobiliárias e marcas já atendidas, como prova social imediata.</figcaption>
    </figure>
  </div>

  <div class="st-mob">
    <figure class="st-fig">
      <div class="st-phone"><img src="m-portfolio.jpg" alt="Portfólio no celular" loading="lazy" decoding="async"/></div>
      <figcaption><b>No celular</b>Portfólio com a foto de cada projeto já à vista.</figcaption>
    </figure>
    <figure class="st-fig">
      <div class="st-phone"><img src="m-clientes.jpg" alt="Clientes no celular" loading="lazy" decoding="async"/></div>
      <figcaption><b>No celular</b>Clientes em duas colunas, leitura confortável.</figcaption>
    </figure>
  </div>
</div>
<div style="height:clamp(24px,3vw,40px)"></div>
</section>
</body>
</html>
