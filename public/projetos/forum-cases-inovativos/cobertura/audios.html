    .fic26-cob-au-bot { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
    .fic26-cob-au-time { font-size: 13px; font-weight: 700; color: #E3ECFA; font-variant-numeric: tabular-nums; }

    .fic26-cob-au-card:hover .fic26-cob-au-pl { transform: scale(1.12); }
