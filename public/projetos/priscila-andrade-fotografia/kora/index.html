<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<base target="_blank"/>
<title>Fotos do projeto Kora · Priscila Andrade</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
html,body{margin:0;padding:0;background:#000;}
</style>
</head>
<body>
<section class="kr">
<style>
.kr{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:#000;padding:clamp(40px,6vw,88px) clamp(16px,4vw,48px) 0;}
.kr *,.kr *::before,.kr *::after{box-sizing:border-box;}
.kr-in{max-width:1240px;margin:0 auto;}
.kr-label{display:block;font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:#B08D57;font-weight:600;margin:0 0 1rem;}
.kr-h{font-family:'Fraunces',Georgia,serif;font-weight:500;font-size:clamp(1.6rem,3.2vw,2.4rem);line-height:1.1;letter-spacing:-.01em;margin:0 0 .8rem;max-width:22ch;color:#F3EEE4;}
.kr-p{font-size:.95rem;line-height:1.6;color:rgba(243,238,228,.68);margin:0 0 clamp(22px,3vw,34px);max-width:56ch;}
.kr-grid{display:grid;grid-template-columns:repeat(2,1fr);grid-auto-rows:minmax(clamp(150px,34vw,260px),auto);gap:.6rem;}
.kr-ph{position:relative;overflow:hidden;border-radius:2px;background:#1B1A18;margin:0;}
.kr-ph img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .6s cubic-bezier(.16,.84,.44,1);}
.kr-ph:hover img{transform:scale(1.045);}
.kr-p03,.kr-p08{grid-column:1/-1;}
@media (min-width:760px){
  .kr-grid{grid-template-columns:repeat(4,1fr);grid-auto-rows:clamp(150px,19vw,250px);}
  .kr-p03,.kr-p08{grid-column:span 2;}
}
</style>
<div class="kr-in">
  <span class="kr-label">Fotografia</span>
  <h2 class="kr-h">Uma página que deixa a foto aparecer</h2>
  <p class="kr-p">O site fica em segundo plano e a fotografia é o elemento mais forte da tela. Aqui, com as fotos do projeto Kora.</p>
  <div class="kr-grid">
    <figure class="kr-ph kr-p03"><img src="03.jpg" alt="Kora — escada em espiral e piso em espinha de peixe" loading="lazy" decoding="async"/></figure>
    <figure class="kr-ph kr-p02"><img src="02.jpg" alt="Kora — circulação entre os blocos" loading="lazy" decoding="async"/></figure>
    <figure class="kr-ph kr-p04"><img src="04.jpg" alt="Kora — piscina interna" loading="lazy" decoding="async"/></figure>
    <figure class="kr-ph kr-p08"><img src="08.jpg" alt="Kora — fachada e jardim" loading="lazy" decoding="async"/></figure>
    <figure class="kr-ph"><img src="10.jpg" alt="Kora — piscina no terraço" loading="lazy" decoding="async"/></figure>
    <figure class="kr-ph"><img src="13.jpg" alt="Kora — espreguiçadeiras na piscina interna" loading="lazy" decoding="async"/></figure>
  </div>
</div>
<div style="height:clamp(32px,4vw,56px)"></div>
</section>
</body>
</html>
